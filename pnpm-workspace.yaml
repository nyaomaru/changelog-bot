# WHY: Delay installs of newly published packages for 48 hours to reduce
# exposure to compromised releases before the ecosystem has time to react.
minimumReleaseAge: 2880

overrides:
  brace-expansion@<2.0.0: 1.1.18
  brace-expansion@>=2.0.0 <3.0.0: 2.1.4
  js-yaml@<4.0.0: 3.15.1

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lefthook: false
  unrs-resolver: false
