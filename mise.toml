[tools]
node = "24.22.1"

[tasks.start]
run = "pnpm start"

[tasks.dev_install]
run = "pnpm install"

[tasks.lint]
run = "pnpm lint"

[tasks.build]
run = "pnpm build"

[tasks.test]
run = "pnpm test"

[tasks.eval_why]
run = "pnpm eval:why"

[tasks.qa]
run = ["pnpm lint", "pnpm test", "pnpm build", "pnpm run check:dist"]
